<text x="150" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="150" dy="0">Holes: 6 x 4.5 mount; timers: 12 shaft (check against the part) and 2 x 4.0 yoke holes at 83.3; 2 x 22.3 for the 22 mm selector and button;</tspan></text>
<text x="150" y="736.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="150" dy="0">2 x 4.5 for the K1 DIN rail standoffs; 2 x 4.5 cable tie anchors. Dashed boxes: timer body 40.6 x 70.9 and yoke 106.4 long, both behind the plate.</tspan></text>
<text x="150" y="752.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="150" dy="0">The 22 mm devices sit 20 above the centre line and the K1 rail 24 below it, so the K1 socket (36 below the rail line) stays inside the aperture.</tspan></text>
<text x="150" y="768.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="150" dy="0">Everything mounted on the back stays inside the 500 x 120 aperture; the 20 mm band outside it sits against the chassis panel.</tspan></text>
<text x="150" y="784.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="150" dy="0">Labels: engrave if the cutter offers it, otherwise a printed strip. Knob diameter is not on the timer&#x27;s sheet: check it before cutting.</tspan></text>
