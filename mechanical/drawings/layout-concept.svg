<text x="120" y="782" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#333" font-style="italic"><tspan x="120" dy="0">Dashed line in the bay: vented builds run an exhaust duct from the blower to the rear port; the heat pump build returns it into the heat module instead.</tspan></text>
<text x="140" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="140" dy="0">air path, vented: louvers &gt; heat module &gt; riser &gt; rear bulkhead &gt; drum &gt; lint filter &gt; blower &gt; exhaust</tspan></text>
<text x="140" y="162.0" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="140" dy="0">air path, heat pump: blower &gt; return duct &gt; heat module (evaporator, condenser) &gt; riser &gt; drum &gt; lint filter &gt; blower</tspan></text>
