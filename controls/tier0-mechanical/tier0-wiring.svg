<text x="24" y="34" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="start" fill="#111" font-weight="bold"><tspan x="24" dy="0">osa-dryer: Tier 0 control module wiring (draft 1, 2026-11-05)</tspan></text>
<text x="24" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">Five wires to J1 and one relay. Everything is a switch. Socket terminal numbers for K1 depend on the socket; write them on this drawing when the socket is in hand.</tspan></text>
<text x="60" y="110" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" fill="#111" font-weight="bold"><tspan x="60" dy="0">J1 plug (Mini-Fit Jr. 16, male terminals)</tspan></text>
