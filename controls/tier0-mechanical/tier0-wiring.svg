<text x="24" y="640" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">Door open or power lost: pin 11 goes to 0 V, K1 drops, both contacts open, nothing is requested. START must be pressed again.</tspan></text>
<text x="24" y="658" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">DRY TIME at zero: its contact is open, K1 cannot pull in. HEAT TIME at zero: no heat request, the motor still runs.</tspan></text>
<text x="24" y="676" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">K1: 24 V DC plug-in relay with suppression diode, 2 changeover contacts; only the n.o. side of each is used. Coil under 50 mA.</tspan></text>
<text x="24" y="694" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">Wire: 0.5 mm2 (20 AWG). Timer and selector terminals take 6.3 mm quick-disconnects or ring terminals; the button&#x27;s contact block takes screws.</tspan></text>
<text x="24" y="712" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#333" font-style="italic"><tspan x="24" dy="0">Pins 1, 2 (+24V) are not used. J2 is not plugged in.</tspan></text>
</svg>